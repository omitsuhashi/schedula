[project]
name = "shift-schedula"
version = "0.1.4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema>=4.26.0",
]

[project.urls]
Repository = "https://github.com/omitsuhashi/schedula"
Issues = "https://github.com/omitsuhashi/schedula/issues"

[project.optional-dependencies]
cp-sat = [
    "ortools>=9.15.6755",
]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
shift_schedula = ["schemas/*/*.json"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
